services:
  # ── Backend API (Node.js / Express) ──────────────────────────────────────────
  - type: web
    name: fantasy-nba-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string in the Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false   # e.g. https://fantasy.cameronjim.com

  # ── Frontend (React / Vite static site) ──────────────────────────────────────
  - type: web
    name: fantasy-nba-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # e.g. https://fantasy-nba-api.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

