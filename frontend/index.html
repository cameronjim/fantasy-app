<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBA IQ</title>
    <script>
      // Apply persisted theme before React paints — prevents a flash of the
      // wrong theme on load. Mirrors the THEMES list in src/hooks/useTheme.ts;
      // keep the two in sync when adding or removing a theme.
      (function () {
        var themes = ['lofi', 'cream', 'sage', 'slate', 'ocean', 'business', 'graphite'];
        var stored = localStorage.getItem('theme');
        var theme = themes.indexOf(stored) !== -1
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'business' : 'lofi');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
