name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (source)
        run: npm run typecheck

      - name: Typecheck (tests)
        run: npm run typecheck:tests

      - name: Unit + API tests
        run: npm test

  frontend:
    name: Frontend (typecheck + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck E2E
        run: npm run typecheck:e2e

      # Caching Playwright browsers across runs cuts ~30s off the cold install.
      # The cache key includes the @playwright/test version so a major upgrade
      # forces a fresh download instead of using stale binaries.
      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers + deps
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # deploy a preview of every pr to the shared dev environment (--stage dev
  # on the lambda side, the dev s3 bucket + cloudfront on the frontend side).
  # only runs on pull_request events, only after all tests pass. "last pr to
  # push wins" — two open prs share one dev environment.
  deploy-preview:
    name: Deploy preview to dev
    needs: [backend, frontend, e2e]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for aws oidc role assumption
      contents: read
      pull-requests: write   # for posting the preview-url comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # backend: serverless deploy --stage dev. uses DEV_DATABASE_URL so a
      # bad migration in a pr can't damage prod data.
      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Deploy backend to dev
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          FRONTEND_URL: ${{ vars.DEV_FRONTEND_URL }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
        # pin to v3 explicitly — v4 demands a serverless.com license key in ci,
        # and serverless.yml sets frameworkVersion '3'.
        run: npx serverless@3 deploy --stage dev

      # frontend: build with the dev api url baked in, sync to dev bucket.
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend for dev
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.DEV_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Upload hashed assets (immutable, long cache)
        working-directory: frontend
        run: |
          aws s3 sync dist/assets/ "s3://${{ vars.DEV_S3_BUCKET }}/assets/" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Upload root files (no cache)
        working-directory: frontend
        run: |
          aws s3 sync dist/ "s3://${{ vars.DEV_S3_BUCKET }}/" \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "assets/*" \
            --delete

      - name: Invalidate dev CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.DEV_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/"

      # post a sticky comment on the pr with the preview urls. updates an
      # existing comment if one exists rather than spamming the pr on every
      # push.
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const frontendUrl = '${{ vars.DEV_FRONTEND_URL }}';
            const apiUrl = '${{ vars.DEV_API_URL }}';
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const marker = '<!-- preview-deploy-bot -->';
            const body =
              marker + '\n' +
              '🚀 **Preview deployed**\n\n' +
              `- Frontend: ${frontendUrl}\n` +
              `- API health: ${apiUrl}/api/health\n` +
              `- Commit: \`${sha}\`\n\n` +
              '_Shared dev environment — the most recent PR push wins. ' +
              'Merge to `main` deploys to production._';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
